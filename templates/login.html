{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card auth-card shadow-sm p-3 p-md-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="auth-mark bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2">
                        <i class="fa-solid fa-lock fs-4"></i>
                    </div>
                    <h4 class="fw-bold">เข้าสู่ระบบ</h4>
                    <p class="text-muted small">ระบบจัดการรายรับ-รายจ่ายทางการเงิน</p>
                </div>
                <form method="POST" action="/login">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label small fw-medium" for="login-email">อีเมล</label>
                        <input id="login-email" type="email" name="email" class="form-control" required autocomplete="email" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium" for="login-password">รหัสผ่าน</label>
                        <input id="login-password" type="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-medium mt-2">เข้าสู่ระบบ</button>
                </form>
                <div class="text-center mt-4 pt-2 border-top">
                    <small class="text-muted">ยังไม่มีบัญชีใช้งาน? <a href="/register" class="text-primary text-decoration-none fw-medium">สมัครสมาชิก</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
